<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="calc/calc.css">
    <link rel="stylesheet" href="nav.css">
    <title>HU-Calculator</title>
</head>
<body>
    <button class="toggle-btn" onclick="toggleDarkMode()">🌙</button>
    <div class="navbar">
        <a href="index.html">Home </a>
        <a href="quiz.html">Quiz </a>
        <a href="todolist.html">Todo </a>
        <a href="weather.html">weather</a>
    </div>
    <div class="calc">
        <input type="text" disabled id="display">
        <div class="calc-btns">
            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button onclick="appendValue('+')">+</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button onclick="appendValue('-')">-</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button onclick="appendValue('*')">&times;</button>

            <button onclick="appendValue('.')">.</button>
            <button onclick="appendValue('0')">0</button>
            <button onclick="clearDisplay()">C</button>
            <button onclick="appendValue('/')">&divide;</button>

        </div>
        <button class="equals" onclick="calculate()">=</button>
    </div>

    <script>
        const display = document.getElementById('display');
        function toggleDarkMode() {
            document.body.classList.toggle("dark");
            const icon = document.querySelector(".toggle-btn");
            icon.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
            localStorage.setItem("darkMode", document.body.classList.contains("dark"));
            }

        function loadTheme() {
        const isDark = localStorage.getItem("darkMode") === "true";
        if (isDark) {
            document.body.classList.add("dark");
            document.querySelector(".toggle-btn").textContent = "☀️";
        }
        }
        function appendValue(value){
            display.value+=value;
        }
        function clearDisplay(){
            display.value=""
        }
        function calculate(){
            try{display.value=eval(display.value);}
            catch{display.value='Error'}
        }
        loadTheme();
    </script>
</body>
</html>
