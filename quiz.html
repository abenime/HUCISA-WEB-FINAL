<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hu-Quiz-App</title>
  <link rel="stylesheet" href="quiz/quizz.css" />
  <link rel="stylesheet" href="nav.css">
</head>
<body>
  <div class="navbar">
    <a href="index.html">Home </a>
    <a href="quiz.html">Quiz </a>
    <a href="todolist.html">Todo </a>
    <a href="weather.html">weather</a>
</div>
  <div class="bdy">
    <h1>Quiz App</h1>

    <div class="slct" id="subjectSelection">
      <h3>Select a Subject to take quiz</h3>
      <div class="subject-buttons">
        <button onclick="startQuiz('math')">Math</button>
        <button onclick="startQuiz('science')">Science</button>
        <button onclick="startQuiz('history')">History</button>
        <button onclick="startQuiz('english')">English</button>
      </div>
    </div>

    <div class="question-box" style="display:none">
        <div class="quiz-header">
          <p id="timer"></p>
        </div>
        <p class="question" id="questionText"></p>
        <div class="options" id="optionsContainer"></div>
        <button id="backBtn" class="back-btn" onclick="goBack()" style="display:none">← Back to Subjects</button>
      </div>
      
      <div id="result"></div>
      
  </div>

  <script src="quiz/questions.js"></script>
  <script src="quiz/quizz.js"></script>
</body>
</html>
