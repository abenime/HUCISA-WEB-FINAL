<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>HU-toolkit</title>
</head>
<body >
    <button class="toggle-btn" onclick="toggleDarkMode()">🌙</button>
    <div class="body-box">
        <h2>Hu Toolkit</h2>
        <h4>Contains all the tools you need in campus life</h4>
        <div class="tool-btns">
            <button ><a href="todolist.html">Todo list</a></button>
            <button ><a href="weather.html">Weather</a></button>
            <button ><a href="quiz.html">Quiz</a></button>
            <button ><a href="calculator.html">Calculator</a></button>
        </div>
    </div>
    <script>
        function toggleDarkMode() {
      document.body.classList.toggle("dark");
      const icon = document.querySelector(".toggle-btn");
      icon.textContent = document.body.classList.contains("dark") ? "☀️" : "🌙";
      localStorage.setItem("darkMode", document.body.classList.contains("dark"));
    }

    function loadTheme() {
      const isDark = localStorage.getItem("darkMode") === "true";
      if (isDark) {
        document.body.classList.add("dark");
        document.querySelector(".toggle-btn").textContent = "☀️";
      }
    }

    loadTheme();
    </script>
</body>
</html>
